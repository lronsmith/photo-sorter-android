name: Release

# Runs only after the CI workflow finishes successfully for a push to main
# (i.e. a merged PR), and builds the exact commit CI tested.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build, sign and publish
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    # Holds the signing secrets; its deployment branch policy allows only main.
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Missing SDK packages (platform / build-tools 37) are installed by the Android Gradle
      # Plugin; the runner image accepts the licences. Read-only cache: this job holds secrets.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      # The release signingConfig is applied only when all four SIGNING_* variables are set;
      # otherwise Gradle writes app-release-unsigned.apk and the verify step below fails.
      - name: Build signed release APK
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Verify signature
        run: |
          # Newest stable build-tools after the build (includes any version AGP just installed).
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          echo "Using build-tools $BUILD_TOOLS"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs \
            app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN: ${{ github.run_number }}
        run: |
          VERSION=$(grep '^appVersionName=' gradle.properties | cut -d= -f2)
          test -n "$VERSION"
          cp app/build/outputs/apk/release/app-release.apk photo-sorter.apk
          sha256sum photo-sorter.apk > photo-sorter.apk.sha256
          gh release create "v$VERSION-build.$RUN" photo-sorter.apk photo-sorter.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SHA" \
            --title "Photo Sorter v$VERSION (build $RUN)" \
            --generate-notes \
            --latest

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
