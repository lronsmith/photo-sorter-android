name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job id and name must stay "build": the ruleset on main requires this status check.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Also validates the Gradle wrapper. Missing SDK packages (platform / build-tools 37)
      # are installed by the Android Gradle Plugin; the runner image accepts the licences.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Lint, unit tests, debug build
        run: ./gradlew lint testDebugUnitTest assembleDebug
